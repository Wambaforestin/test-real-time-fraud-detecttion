services:
  # ============================================
  # KAFKA STACK (Confluent 7.5.0)
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fraud-zookeeper
    hostname: fraud-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - fraud-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraud-kafka
    hostname: fraud-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: fraud-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://fraud-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - fraud-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: fraud-schema-registry
    hostname: fraud-schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081" # Schema Registry reste sur 8081
    environment:
      SCHEMA_REGISTRY_HOST_NAME: fraud-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: fraud-kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - fraud-network

  # ============================================
  # HADOOP HDFS STACK (Stable 3.2.1)
  # ============================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: fraud-namenode
    hostname: fraud-namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=fraud-detection-cluster
      - CORE_CONF_fs_defaultFS=hdfs://fraud-namenode:9000
      - HDFS_CONF_dfs_permissions_enabled=false
    volumes:
      - namenode-data:/hadoop/dfs/name
    networks:
      - fraud-network

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: fraud-datanode
    hostname: fraud-datanode
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://fraud-namenode:9000
      - HDFS_CONF_dfs_datanode_data_dir=file:///hadoop/dfs/data
    volumes:
      - datanode-data:/hadoop/dfs/data
    networks:
      - fraud-network

  # ============================================
  # SPARK STACK (Image officielle Apache)
  # ============================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: fraud-spark-master
    hostname: fraud-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark-jobs:/opt/spark-jobs
    networks:
      - fraud-network

  spark-worker:
    image: apache/spark:3.5.0
    container_name: fraud-spark-worker
    hostname: fraud-spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://fraud-spark-master:7077
    ports:
      - "8083:8081" # Changement ici : 8083 pour éviter le conflit avec Schema Registry
    networks:
      - fraud-network

  # ============================================
  # MONGODB STACK
  # ============================================
  mongodb:
    image: mongo:latest
    container_name: fraud-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb-data:/data/db
    networks:
      - fraud-network

  mongo-express:
    image: mongo-express:latest
    container_name: fraud-mongo-express
    depends_on:
      - mongodb
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@fraud-mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - fraud-network

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  namenode-data:
  datanode-data:
  mongodb-data:

networks:
  fraud-network:
    driver: bridge